# Internal playback is unqualified. ACP fallback/pro-audio nodes can route to
# speakers without "Speakers" in their name, so deny all platform-sound outputs.
# Only a dedicated UCM Headphones node is exempt; USB/Bluetooth are unaffected.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\\.platform-sound\\..*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output\\.platform-sound\\..*Headphones.*" }
    ]
    actions = {
      update-props = {
        node.disabled = false
      }
    }
  }
]
