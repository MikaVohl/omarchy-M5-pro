# The J716s physical speaker route is not validated. Keep headphone/USB audio.
# RawSpeakers is the official omarchy-platform/audio.json ALSA node identity.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\\.platform-sound\\..*Speakers.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
